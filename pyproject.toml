[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-desktop"
version = "1.0.0"
description = "VISION desktop chat client and tool runtime"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "SPIRIT ORG"}]
dependencies = [
  "PySide6>=6.7",
  "pywebview>=6.2.1",
  "httpx>=0.28",
  "pydantic>=2",
  "psutil",
  "pywin32>=312; sys_platform == \"win32\"",
  "pyperclip",
  "ddgs",
  "huggingface_hub",
  "mcp",
  "PyYAML",
  "jsonschema",
  "pypdf",
  "python-docx",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Desktop boundary code intentionally isolates broad failures into visible errors/tool replies.
ignore = ["BLE001", "S110", "S112", "TRY004"]
